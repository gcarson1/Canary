[package]
name = "daw-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "latency", "params", "state"] }
clack-host = "0.2"
daw-core = { path = "../daw-core" }
daw-dsp = { path = "../daw-dsp" }
daw-graph = { path = "../daw-graph" }
rtrb = "0.4"
vst3 = "0.3"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "bitflags", "AUComponent", "AudioComponent", "AudioUnitProperties", "MusicDevice", "objc2-core-audio-types", "objc2-core-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "bitflags", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFBundle", "CFData", "CFError", "CFPropertyList", "CFString", "CFURL"] }

[dev-dependencies]
assert_no_alloc = "1.1"
daw-engine = { path = "../daw-engine" }
clack-extensions = { version = "0.2", features = ["clack-host", "clack-plugin", "audio-ports", "latency", "params", "state"] }
clack-host = { version = "0.2", features = ["clack-plugin"] }
clack-plugin = "0.2"
